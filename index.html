<style>
/* VOICE 공공 안내판처럼 차분하고 명료하게 / IDEA 공원 입구 주차 안내 전광판 / PICTURE 시간대별 이용률 곡선
   COLOUR 흰 바탕·잉크, 데이터 블루 한 가지, 경보는 상태색+아이콘+글자 / TYPE Pretendard 계열 시스템 산세리프
   LAYOUT 결론(지표)→그래프→행동 안내 순, 600px 이하 한 줄 배치 */
:root{color-scheme:light;--bg:#f4f3ef;--s1:#fcfcfb;--line:#e4e2dc;--t1:#0b0b0b;--t2:#52514e;--t3:#7a7974;--s-1:#2a78d6;--s-2:#eb6834;--band:#cde2fb;--warn:#fab219;--crit:#d03b3b;--good:#0ca30c}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--bg:#111110;--s1:#1a1a19;--line:#2e2d2a;--t1:#f0efec;--t2:#c3c2b7;--t3:#9a998f;--s-1:#3987e5;--s-2:#d95926;--band:#1c3a5f}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111110;--s1:#1a1a19;--line:#2e2d2a;--t1:#f0efec;--t2:#c3c2b7;--t3:#9a998f;--s-1:#3987e5;--s-2:#d95926;--band:#1c3a5f}
*{box-sizing:border-box;min-width:0}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--t1);overflow-x:clip}
header,nav,main,footer{max-width:1000px;margin:auto;padding-left:max(4vw,16px);padding-right:max(4vw,16px)}
header{padding-top:26px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,34px);margin:0 0 2px;letter-spacing:-.5px;line-height:1.1}h1 b{color:var(--s-1)}
.sub{color:var(--t2);margin:0;font-size:15px}
.lang{border:1px solid var(--line);background:var(--s1);color:var(--t1);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
nav{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--s1);color:var(--t1);padding:9px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
nav button[aria-selected=true]{background:var(--t1);color:var(--s1);border-color:var(--t1)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--s-1);outline-offset:2px}
main{padding-top:14px;padding-bottom:30px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--s1);color:var(--t1);max-width:100%;min-height:44px}
input[type=range]{flex:1;min-width:160px;min-height:44px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{color:var(--t2);font-size:14px}.kpi .v{font-size:clamp(22px,3vw,26px);font-weight:700;letter-spacing:-.5px;white-space:nowrap}.kpi .n{color:var(--t3);font-size:13px}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:2px 8px;border:1px solid var(--line);color:var(--t2);margin:2px 4px 2px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--t2);margin:6px 0}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.fig{position:relative;height:270px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
svg text{fill:var(--t3);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--t1);color:var(--s1);font-size:13px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--t2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.muted{color:var(--t3);font-size:14px}
.rec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.rec:last-child{border:0}
.rec .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--t2)}
.lv{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600}
.hide{display:none}
footer{padding-bottom:30px;color:var(--t3);font-size:13px}
a{color:var(--s-1)}
@media(max-width:600px){.card{padding:14px}.fig{height:230px}table{font-size:13px}}
</style>
</head>

  r4: (h) => ['귀가 시간 분산', `출차는 공연 시작 2~3시간 뒤(${h} 전후)에 몰립니다. 2025년 KSPO DOME 공연일 68일 중 56일이 그랬습니다. 출구 혼잡을 줄이려면 공연 종료 전 시차 귀가 안내가 필요합니다.`],

  opsT: '운영자 모드 — 시간대별 경보와 권장 조치', opsS: '선택한 날짜의 예상치(중간·최악)를 근거로 주차 안내 인력, 구역 유도, 대중교통 안내 시점을 제안합니다.',

  rdate: '재현 날짜', now: '현재 시각', rnote: '2025-11-01(토)·02(일): KSPO DOME·올림픽홀 공연이 겹쳐 재차가 3,229대·3,181대로 공개 수용(2,200대)을 넘은 날입니다. 2025년 1~7월 데이터로만 학습한 모델로 예측했습니다(시간순 홀드아웃).',
  lg2: ['실측 재차대수', '나우캐스트(1~3시간 뒤)', '평균 프로파일(사전 예측)'], rk: ['나우캐스트 오차(다음 3시간)', '현재값 유지 시 오차', '평균 프로파일 오차'], rkn: ['평균절대오차', '지금 숫자를 그대로 표시', '공연 반영 없는 사전 예측'],
  accT: '예측 정확도 (2025년 입출차 1,975,475건 · 원천 수록이 완전한 240일)', accH: ['방식', '월 단위 교차검증 MAE(대)', '10~12월 홀드아웃 MAE(대)', '홀드아웃 MAPE'], nm: {profile: '평균 프로파일(같은 달·요일유형)', seasonal_naive: '전주 같은 시각', persist: '현재값 유지', pre_event_gbm: '사전 예측(공연·달력·기상)', event_shape_persist: '현재값 + 공연일 평균 변화(강한 기준)', nowcast: '올팍 나우 나우캐스트', nowcast_q80: '올팍 나우 위험측(80% 분위)'},
  accN: (g, m) => `MAE·MAPE는 공연일 15~22시의 1~3시간 뒤 예측 기준. 나우캐스트 개선폭 95% 신뢰구간(공연일 부트스트랩 2,000회, 홀드아웃): 평균 프로파일 대비 ${g.holdout_q4.improve_ci95_vs_profile[0]}~${g.holdout_q4.improve_ci95_vs_profile[2]}대, 현재값 유지 대비 ${g.holdout_q4.improve_ci95_vs_persist[0]}~${g.holdout_q4.improve_ci95_vs_persist[2]}대. 홀드아웃 경보: 혼잡(70%) 재현율 ${g.holdout_q4.busy70_nowcast.recall}·정밀도 ${g.holdout_q4.busy70_nowcast.precision}(현재값 유지 ${g.holdout_q4.busy70_persist.recall}·${g.holdout_q4.busy70_persist.precision}), 만차(90%) 재현율 ${g.holdout_q4.full90_nowcast_q80.recall}(위험측). 가장 강한 기준(현재값 + 공연일 평균 변화) 대비 개선폭 95% 신뢰구간 ${g.holdout_q4.improve_ci95_vs_event_shape[0]}~${g.holdout_q4.improve_ci95_vs_event_shape[2]}대. 전날 시나리오는 10~12월 공연일 ${M.scen_eval.test_event_days}일 중 혼잡·만차·수용 초과가 난 날을 하나도 놓치지 않았지만(오경보 ${M.scen_eval.busy70.false_alarm}·${M.scen_eval.full90.false_alarm}·${M.scen_eval.over.false_alarm}일), 시각별 범위 적중률은 ${Math.round(M.scen_eval.band_coverage_9_22*100)}%라 정확한 시각과 규모는 당일 보정에 맡깁니다. ${M.live_field?.date ? `현장 검증(${M.live_field.date} KSPO DOME 공연, 실시간 API ${M.live_field.samples}회): 전날 범위가 09~22시 실측을 ${Math.round(M.live_field.pre_band_coverage_9_22*100)}% 포함, 최대 주차 예측 ${M.live_field.peak_pre_mid[1].toLocaleString()}대·실측 ${M.live_field.peak_actual_adj[1].toLocaleString()}대, 나우캐스트 오차 ${M.live_field.mae_evening.nowcast}대(현재값 유지 ${M.live_field.mae_evening.persist}대). ` : ''}2024년 7월 독립 검증(31회 날짜 교차검증)에서도 ${m.gbm.mae_event_evening}대로 평균 프로파일 ${m.profile.mae_event_evening}대보다 작았습니다.`,
  qT: '분석 중 발견한 데이터 품질 개선점', qual: ['2025 입출차 정보(2,411,225건): 매월 말일 기록이 0건이고, 8·9월은 일평균 약 2.2천 건으로 다른 달(약 9.4천 건)의 23%, 11·12월은 1~7일만 수록되어 있습니다. 전수 집계로 확인했고, 수록이 완전한 날만 학습에 썼습니다.', '공연일 28일·117시간 동안 동2·남2·북2문 재차가 공개 수용 2,200대를 넘었습니다(최대 3,563대, 2025-04-06). 임시 주차 운영 여부나 수용 기준은 공개 자료로 확인되지 않아 확인이 필요하며, 현재 이용률 안내는 100%를 넘는 상황을 표현하지 못합니다.', '주차장 혼잡도 정보: 등록시간 699건 모두 분·초 자리에 등록일의 월·일이 들어가 있어(예: 2025-12-27 → 17:12:27) 시 단위만 유효합니다.', '2024년 7월 올림픽공원 주차 대수가 월별주차현황 59,808대, 입출차 정보 215,528건으로 집계 기준이 문서에 드러나지 않습니다.'],
  dataT: '사용한 공공데이터', limT: '한계와 개선 계획', dataH: ['데이터', '제공', '활용'], lim: ['8·9월과 11월 7일 이후·12월 7일 이후는 원천 데이터 수록이 불완전해 학습·평가에서 뺐습니다. 기관이 전체 기록을 다시 제공하면 같은 코드로 재학습합니다.', '실시간 연동은 구조만 설계했고, 효과는 과거 데이터 재현(홀드아웃)으로 검증했습니다. 도입 시 실시간 주차현황 API를 주기 수집하는 서버로 상시 운영합니다.', '사전 예측(전날 기준)은 홀드아웃 MAPE 33.7%로, 당일 실측 보정(14.5%)이 필수입니다.', '전날 예측은 공연일을 모두 주의로 분류해, 어떤 공연이 실제로 붐빌지는 당일 보정으로 구분합니다(예매 현황 데이터가 있으면 개선 가능).'],
  foot: '데이터: 공공데이터포털 한국체육산업개발주식회사 올림픽공원 입출차 정보(2025 전수·2024-07)·월별주차현황·주차장 혼잡도 정보·공연정보, 한국체육산업개발 홈페이지 공연 일정·공연장·주차 안내, 기상 Open-Meteo. 예측값은 참고용입니다. · 제작 Bugeon Park', tipR: '범위'},
 en: {sub: 'Concert-day parking operations decision support, calibrated with live entry/exit data — built on KSPO&CO public data', tabs: ['Operations dashboard', 'Nowcast check', 'Visitor guide', 'Validation & data'],

  liveL: 'Observed (live API, night-baseline adjusted)', liveWait: (n, hh, v) => `${n} live samples · last ${hh}: ${v.toLocaleString()} cars. The observed line appears once the 03:00–05:00 baseline for adjustment has been collected.`, liveN: (n, hh, v, off, ok) => `${n} live samples · last ${hh}: ${v.toLocaleString()} cars. The live API counts on a different basis, so ${ok ? `the night-baseline gap of ${off.toLocaleString()} cars is removed` : 'values are shown unadjusted'} (KSPO&CO public API, every 5 minutes).`, ok5: 'Expected cars over capacity', ok5n: 'worst case − 2,200 published spaces (overflow or diversion)', over: 'Over capacity', full: 'Full', cong: 'Busy', ok: 'OK', around: '', reach: 'Full at', noreach: 'Not full', before: '', k3n: '1 hour before reaching 70%', k4n: 'Show start +2–3h (56 of 68 KSPO DOME show days in 2025)',
  recT: 'Recommendations', r1: ['Take the subway', 'Nearest station: Olympic Park Station, Lines 5 & 9 (official parking guide). The park also asks visitors to use public transport on big concert days.'],

  r5: 'Why the range is wide: excess parking on KSPO DOME show days ranged from 517 to 1,924 cars (2025, 68 days, 10th–90th pct). On the day, the nowcast narrows it using live entry/exit counts.',

  opsH: ['Hour', 'Expected', 'Worst', 'Alert', 'Suggested action'], act: {pre: 'Send transit advisory (SMS/SNS)', zone: 'Switch on signs guiding to P1/P10 before P6/P4/P5 fill', full: 'Prepare entry control; point to off-site parking and transit', exit: 'Exit staff at South 2/East 2 gates; staggered-exit notice', calm: '-', over: n => `Overflow / alternative parking notice (~${n} cars over)`},
  ok1: 'Busy (70%) risk from', ok1n: 'first hour, worst case', ok2: 'Full (90%) risk from', ok2n: 'first hour, worst case', ok3: 'Exit staffing at', ok4: 'Expected peak', ok4n: 'middle scenario', zoneT: 'Lot fill order (public parking congestion data, 699 records)', zoneS: 'Based on 62 days with full-lot records. First-full days = times the lot was the first recorded full that day.', zoneH: ['Lot', 'Near', 'Full records', 'Median full hour', 'First-full days'],
  rdate: 'Replay date', now: 'Current time', rnote: '2025-11-01 (Sat) and 02 (Sun): shows at KSPO DOME and Olympic Hall overlapped and 3,229 / 3,181 cars were parked, above the published 2,200 spaces. Predicted by a model trained only on Jan–Jul 2025 (time-ordered holdout).',
  lg2: ['Observed cars parked', 'Nowcast (1–3h ahead)', 'Average profile'], rk: ['Nowcast error (next 3h)', 'Error if current value is held', 'Average-profile error'], rkn: ['Mean absolute error', 'Showing today\'s number as is', 'No show information'],

    const x = h => Lm + (W - Lm - R) * h / 23, y = v => Tp + (Hh - Tp - B) * (1 - v / yMax);
    let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${t('chartT')}">`;
    for (let v = 0; v <= yMax; v += 500) s += `<line x1="${Lm}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${Lm - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    for (let h = 0; h < 24; h += small ? 6 : 3) s += `<text x="${x(h)}" y="${Hh - 7}" text-anchor="middle">${h}${L === 'ko' ? '시' : 'h'}</text>`;
    [[T70, '70%', 'var(--warn)'], [T90, '90%', 'var(--crit)']].forEach(([v, tx, c]) => s += `<line x1="${Lm}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - R}" y="${y(v) - 4}" text-anchor="end" style="fill:var(--t2)">${tx}</text>`);
    if (band) { const p = band.hi.map((v, h) => `${x(h)},${y(v)}`).concat(band.lo.map((v, h) => `${x(h)},${y(v)}`).reverse()); s += `<polygon points="${p.join(' ')}" fill="var(--band)" opacity=".85"/>`; }
    if (vline != null) s += `<line x1="${x(vline)}" x2="${x(vline)}" y1="${Tp}" y2="${Hh - B}" stroke="var(--t2)"/>`;
    for (const se of series) {
      const pts = []; for (let h = se.from ?? 0; h <= (se.to ?? 23); h++) if (se.y[h] != null) pts.push(`${x(h)},${y(se.y[h])}`);
      s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2}" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} opacity="${se.op || 1}"/>`;
      if (se.dots) for (let h = se.from; h <= se.to; h++) if (se.y[h] != null) s += `<circle cx="${x(h)}" cy="${y(se.y[h])}" r="4.5" fill="${se.color}" stroke="var(--s1)" stroke-width="2"/>`;
    }
    for (const m of marks) s += `<text x="${x(m.h)}" y="${y(m.v) - 9}" text-anchor="middle" style="fill:var(--t1);font-weight:600;font-size:12px">${m.t}</text>`;

    el.innerHTML = s;

      const r = sv.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX);
      const h = Math.max(0, Math.min(23, Math.round((cx - r.left - Lm) / (W - Lm - R) * 23)));

      const lines = series.filter(se => se.name && se.y[h] != null && h >= (se.from ?? 0) && h <= (se.to ?? 23)).map(se => `${se.name} ${Math.round(se.y[h])} (${pct(se.y[h])})`);
      if (band) lines.push(`${t('tipR')} ${Math.round(band.lo[h])}–${Math.round(band.hi[h])}`);
      tip.innerHTML = `<b>${fmtH(h)}</b><br>` + lines.join('<br>'); tip.style.display = 'block';
      tip.style.left = (cx + scrollX) + 'px';
      tip.style.top = (r.top + scrollY + 10) + 'px';

    sv.onmouseleave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); };

}

function forecast(d) {
  const wd = new Date(d + 'T00:00:00+09:00').getDay(), weekend = wd === 0 || wd === 6 || HOL.has(d);
  const mo = String(+d.slice(5, 7)), base = M.profile_m[mo][weekend ? 'weekend' : wd === 5 ? 'friday' : 'weekday'], sc = M['dome_excess_scenarios_rel_start_-6_to_+5'];
  const add = k => { const o = Array(24).fill(0), seen = new Set(); for (const se of byDate[d].slice().sort((a, b) => a.s - b.s)) { if (seen.has(se.v)) continue; seen.add(se.v); const VS = (M.venue_excess_scenarios || {})[se.v], src = se.v === '야외' ? M.outdoor_excess_scenarios : se.v === 'KSPO DOME' ? sc : VS || sc, w = (se.v === '야외' || se.v === 'KSPO DOME' || VS) ? 1 : (M.venues[se.v]?.seats ?? 0) / 15000; const r0 = M.scen_from ?? -6; for (let i = 0; i < src[k].length; i++) { const h = se.s + r0 + i; if (h >= 0 && h < 24) o[h] += src[k][i] * w; } } return o; };

  const A = ['low', 'mid', 'high'].map(mk); return {weekend, base, mid: A[1], lo: A[0].map((_, h) => Math.min(...A.map(x => x[h]))), hi: A[0].map((_, h) => Math.max(...A.map(x => x[h])))};
}

const LIVE = {};
async function loadLive(d) {
  if (d in LIVE) return LIVE[d];

  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10), d0 = new Date(Date.parse(today) - 864e5 * 30).toISOString().slice(0, 10);
  if (d > today || d < '2026-11-21' || d < d0) return null;  // 수집 기간 밖이면 요청하지 않음
  try {
    const r = await fetch(`https://raw.githubusercontent.com/Bugeon151/olpark-now/live-data/data/live/${d}.csv`, {cache: 'no-store'});
    if (!r.ok) return null;
    const pts = (await r.text()).trim().split('\n').map(l => l.split(',')).filter(x => x[1]).map(([ts, n]) => [new Date(ts.replace(/(\d{2})(\d{2})$/, '$1:$2')), +n]);
    if (!pts.length) return null;
    const day = new Date(d + 'T00:00:00+09:00'), raw = Array(24).fill(null);
    for (let h = 0; h < 24; h++) { const tg = +day + (h * 60 + 30) * 6e4; let best = null; for (const [t0, n] of pts) { const dt = Math.abs(t0 - tg); if (dt <= 9e5 && (!best || dt < best[0])) best = [dt, n]; } if (best) raw[h] = best[1]; }
    LIVE[d] = {raw, n: pts.length, last: pts[pts.length - 1]};
  } catch (e) { LIVE[d] = null; }
  return LIVE[d];
}

  $('#lim').innerHTML = t('lim').map(x => `<li>${x}</li>`).join('');
  const DS = L === 'ko' ? [
    ['올림픽공원 입출차 정보 2025 (2,411,225건 전수)', '한국체육산업개발 · 문화공공데이터광장 API', '12개월 재차 복원·학습·검증'], ['올림픽공원 입출차 정보 (2024-07, 215,528건)', '한국체육산업개발 · 15138735', '독립 검증(2024-07)'], ['주차장 혼잡도 정보 (699건)', '한국체육산업개발 · 15164156', '구역별 만차 순서·시각 → 구역 유도'], ['월별주차현황 (2023~2025)', '한국체육산업개발 · 15131671', '계절성·집계 기준 점검'],
    ['영문 공연정보 · 올림픽공원 공연정보', '한국체육산업개발 · 15149169 / 3037877', '영문 모드·공연 일정 연동'], ['실시간 주차현황', '한국체육산업개발 · 15168686', '당일 나우캐스트 입력'], ['2025 입출차·공연·날씨 연계 데이터', '한국체육산업개발 · 15164822', '공연 관람객 수 변수, 재차 교차검증(상관 0.95)'], ['시간별 기상 (2024-07, 2025)', 'Open-Meteo', '기온·강수 변수']] : [
    ['Olympic Park entry/exit 2025 (all 2,411,225)', 'KSPO&CO · Culture Data Plaza API', '12-month occupancy, training, validation'], ['Olympic Park entry/exit (Jul 2024, 215,528)', 'KSPO&CO · 15138735', 'Independent check (Jul 2024)'], ['Parking congestion (699 records)', 'KSPO&CO · 15164156', 'Lot fill order → lot guidance'], ['Monthly parking (2023–2025)', 'KSPO&CO · 15131671', 'Seasonality, counting checks'],
    ['English performance info · Performances', 'KSPO&CO · 15149169 / 3037877', 'English mode, schedules'], ['Real-time parking', 'KSPO&CO · 15168686', 'Same-day nowcast input'], ['2025 entry/exit·performance·weather', 'KSPO&CO · 15164822', 'Audience size feature; occupancy cross-check (r = 0.95)'], ['Hourly weather (Jul 2024, 2025)', 'Open-Meteo', 'Temperature, rain']];
  $('#dt').innerHTML = `<tr>${t('dataH').map(x => `<th>${x}</th>`).join('')}</tr>` + DS.map(r => `<tr><td>${r[0]}</td><td class="muted">${r[1]}</td><td>${r[2]}</td></tr>`).join('');
}

/* 탭·언어 */
const IDS = ['ops', 'replay', 'plan', 'valid'];
let cur = IDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'ops';
function show(id) {
  cur = id; IDS.forEach(x => $('#' + x).classList.toggle('hide', x !== id)); $('#dcard').classList.toggle('hide', !['ops', 'plan'].includes(id));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === id));
  if (id === 'replay') drawReplay();
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
function render() {
  document.documentElement.lang = L; $('#lang').textContent = L === 'ko' ? 'English' : '한국어';
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  $('#tabs').innerHTML = t('tabs').map((n, i) => `<button role="tab" data-t="${IDS[i]}">${n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
  const ds = $('#date'), keep = ds.value;
  ds.innerHTML = dates.map(d => `<option value="${d}">${d} (${dow(d)}) · ${byDate[d].map(x => vn(x.v)).join(', ')}</option>`).join('');
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  ds.value = keep || dates.find(d => d >= today) || dates[0];
  $('#rd').innerHTML = Object.keys(M.replay).map(d => `<option>${d}</option>`).join('');
  drawPlan(); drawZones(); drawValid(); show(cur);
}
$('#lang').onclick = () => { L = L === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('olpark-lang', L); } catch (e) {} render(); };
$('#date').onchange = drawPlan; $('#rd').onchange = drawReplay; $('#h0').oninput = drawReplay;
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (IDS.includes(h) && h !== cur) show(h); });
render();
}
</script>
